services:
  - type: web
    name: apitide-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn company_web.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false